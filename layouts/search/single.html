{{ define "main" }}
  <section class="mx-auto max-w-5xl px-4 py-12 sm:px-6 md:px-8 md:py-20">
    <h1 class="text-3xl font-semibold tracking-tight sm:text-4xl">{{ .Title }}</h1>
    <p class="mt-4 max-w-3xl text-base leading-relaxed text-muted sm:text-lg">
      {{ with .Params.description }}{{ . }}{{ else }}Search the site by page title, topic, or natural-language query.{{ end }}
    </p>

    <div
      class="mt-8"
      data-search-widget
      data-search-index="{{ partial "search-payload-url.html" . }}"
      data-search-empty="Type something to search."
      data-search-no-results="No results for"
      data-search-error="Search index not available."
      data-search-loading="Searching..."
      data-search-results-label="Results for"
      data-search-limit="50"
      data-search-highlight="true"
    >
      <form action="{{ "/search/" | relLangURL }}" method="get" class="relative">
        <span class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-muted">
          <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16Zm7-1 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </span>
        <input
          type="search"
          name="q"
          data-search-input
          autocomplete="off"
          placeholder="Search Open Location Stack"
          aria-label="Search Open Location Stack"
          class="w-full rounded-full border border-line bg-white py-3 pl-12 pr-24 text-base text-ink outline-none ring-0 placeholder:text-muted focus:border-ink"
        />
        <div class="absolute right-3 top-1/2 hidden -translate-y-1/2 items-center gap-1 flex" data-search-controls>
          <button
            type="button"
            data-search-clear
            aria-label="Clear search"
            class="flex h-8 w-8 items-center justify-center rounded-full text-xs font-semibold uppercase tracking-[0.18em] text-muted hover:bg-neutral-100 hover:text-ink"
          >
            x
          </button>
          <button
            type="submit"
            aria-label="Submit search"
            class="flex h-8 w-8 items-center justify-center rounded-full text-muted hover:bg-neutral-100 hover:text-ink"
          >
            <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M10 6h8M10 18h8M18 6v5a4 4 0 0 1-4 4H6m0 0 3-3m-3 3 3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>
      </form>

      <div class="mt-6 text-xs font-semibold uppercase tracking-[0.18em] text-muted" data-search-status role="status" aria-live="polite">
        Type something to search.
      </div>
      <div class="mt-6 grid gap-4" data-search-results></div>
    </div>
  </section>
{{ end }}
