{{ $section := .section }}
<section id="{{ $section.id }}" class="border-t border-line">
  <div class="mx-auto flex max-w-6xl flex-col gap-6 px-4 py-12 sm:px-6 md:flex-row md:items-center md:justify-between md:px-8 md:py-16">
    <div class="max-w-3xl">
      <h2 class="text-2xl font-semibold tracking-tight sm:text-3xl">{{ $section.title }}</h2>
      <p class="mt-3 text-muted">{{ $section.text }}</p>
    </div>
    <a href="{{ $section.action.href }}" class="inline-flex h-fit w-full items-center justify-center rounded-full bg-accent px-6 py-3 text-sm font-semibold text-white transition hover:bg-black sm:w-auto">{{ i18n $section.action.label_i18n }}</a>
  </div>
</section>
