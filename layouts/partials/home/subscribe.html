{{ $section := .section }}
<section id="{{ $section.id }}" class="border-y border-line bg-neutral-50/50">
  <div class="mx-auto grid max-w-6xl gap-8 px-4 py-12 sm:px-6 md:px-8 md:py-16 lg:grid-cols-[minmax(0,1.2fr)_minmax(22rem,28rem)] lg:items-center">
    <div class="max-w-3xl">
      {{ with $section.eyebrow }}
        <p class="text-xs font-semibold uppercase tracking-[0.18em] text-muted">{{ . }}</p>
      {{ end }}
      <h2 class="mt-3 text-2xl font-semibold tracking-tight sm:text-3xl">{{ $section.title }}</h2>
      <p class="mt-4 text-muted">{{ $section.intro }}</p>
    </div>
    <form
      class="rounded-3xl border border-line bg-white p-6 shadow-[0_20px_50px_rgba(15,23,42,0.06)]"
      data-listmonk-subscribe
      action="https://listmonk.formationxyz.com/api/public/subscription"
      method="post"
      novalidate
    >
      <input type="hidden" name="l" value="{{ $section.list_uuid }}" />
      <div class="grid gap-4">
        <label class="grid gap-2">
          <span class="text-sm font-medium">{{ $section.fields.name.label }}</span>
          <input
            type="text"
            name="name"
            autocomplete="name"
            placeholder="{{ $section.fields.name.placeholder }}"
            class="w-full rounded-2xl border border-line bg-white px-4 py-3 text-sm text-ink outline-none placeholder:text-muted focus:border-ink"
          />
        </label>
        <label class="grid gap-2">
          <span class="text-sm font-medium">{{ $section.fields.email.label }}</span>
          <input
            type="email"
            name="email"
            autocomplete="email"
            placeholder="{{ $section.fields.email.placeholder }}"
            required
            class="w-full rounded-2xl border border-line bg-white px-4 py-3 text-sm text-ink outline-none placeholder:text-muted focus:border-ink"
          />
        </label>
        <button
          type="submit"
          class="inline-flex items-center justify-center rounded-full bg-accent px-6 py-3 text-sm font-semibold text-white transition hover:bg-black disabled:cursor-not-allowed disabled:opacity-60"
        >
          {{ $section.action.label }}
        </button>
      </div>
      <p
        class="mt-4 min-h-[1.25rem] text-sm text-muted"
        data-listmonk-status
        data-submitting="{{ $section.status.submitting }}"
        data-missing-email="{{ $section.status.missing_email }}"
        data-error="{{ $section.status.error }}"
        aria-live="polite"
      >{{ $section.status.idle }}</p>
    </form>
    <div class="hidden rounded-3xl border border-line bg-white p-6 shadow-[0_20px_50px_rgba(15,23,42,0.06)]" data-listmonk-success role="status" aria-live="polite">
      <p class="text-xs font-semibold uppercase tracking-[0.18em] text-muted" data-listmonk-success-eyebrow>{{ $section.success.eyebrow }}</p>
      <h3
        class="mt-3 text-2xl font-semibold tracking-tight"
        data-listmonk-success-title
        data-pending-title="{{ $section.success.pending_title }}"
        data-subscribed-title="{{ $section.success.subscribed_title }}"
      >{{ $section.success.subscribed_title }}</h3>
      <p
        class="mt-4 text-muted"
        data-listmonk-success-body
        data-pending-body="{{ $section.success.pending_body }}"
        data-subscribed-body="{{ $section.success.subscribed_body }}"
      >{{ $section.success.subscribed_body }}</p>
      <button
        type="button"
        class="mt-5 text-sm font-medium text-ink underline underline-offset-4 transition hover:text-muted"
        data-listmonk-reset
      >
        {{ $section.success.reset_label }}
      </button>
    </div>
  </div>
</section>
