{{ $section := .section }}
<section id="{{ $section.id }}" class="border-y border-line bg-neutral-50/50">
  <div class="mx-auto max-w-6xl px-4 py-12 sm:px-6 md:px-8 md:py-20">
    <div class="grid gap-8 lg:grid-cols-[0.95fr_1.05fr] lg:items-start">
      <div>
        <h2 class="text-3xl font-semibold tracking-tight md:text-4xl">{{ $section.title }}</h2>
        <p class="mt-4 max-w-3xl text-muted">{{ $section.intro }}</p>
        <figure class="mt-8 overflow-hidden rounded-2xl border border-line bg-white">
          <img src="{{ $section.image.src }}" alt="{{ $section.image.alt }}" class="h-full w-full object-cover" />
        </figure>
      </div>

      <div class="grid gap-4 md:grid-cols-2">
        {{ range $section.cards }}
          <article class="rounded-xl border border-line bg-white p-5">
            <h3 class="text-lg font-semibold">{{ .title }}</h3>
            <p class="mt-3 text-sm leading-relaxed text-muted">{{ .description }}</p>
          </article>
        {{ end }}
      </div>
    </div>
  </div>
</section>
