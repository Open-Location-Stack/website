{{ $section := .section }}
{{ $label := $section.label }}
{{ with $section.label_i18n }}
  {{ $label = i18n . }}
{{ end }}
<section{{ with $section.section_class }} class="{{ . }}"{{ end }}>
  <div class="mx-auto max-w-6xl px-4 py-10 sm:px-6 md:px-8 md:py-12">
    <p class="mb-6 text-xs font-semibold uppercase tracking-[0.18em] text-muted">{{ $label }}</p>
    <div class="flex flex-wrap items-center gap-8 md:justify-between md:gap-12">
      {{ range $section.links }}
        {{ if eq .type "image" }}
          <a href="{{ .href }}" aria-label="{{ .aria_label }}">
            <img src="{{ .src }}" alt="{{ .alt }}" class="{{ .class }}" />
          </a>
        {{ else }}
          <a href="{{ .href }}" class="{{ .class }}">{{ .label }}</a>
        {{ end }}
      {{ end }}
    </div>
  </div>
</section>
