{{ define "main" }}
  <article class="mx-auto max-w-4xl px-4 py-12 sm:px-6 md:px-8 md:py-20">
    <header class="max-w-3xl">
      <p class="text-sm text-muted">
        <a href="{{ "/news/" | relLangURL }}" class="underline decoration-accent decoration-2 underline-offset-4">News</a>
        <span class="mx-2">/</span>
        <time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Date.Format "2 January 2006" }}</time>
      </p>
      <h1 class="mt-4 text-3xl font-semibold tracking-tight sm:text-4xl">{{ .Title }}</h1>
      {{ with .Description }}
        <p class="mt-4 text-base leading-relaxed text-muted sm:text-lg">{{ . }}</p>
      {{ end }}
    </header>

    <section class="prose mt-10 max-w-none">
      {{ .Content }}
    </section>
  </article>
{{ end }}
