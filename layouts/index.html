{{ define "main" }}
  {{ $lang := .Site.Language.Lang | default "en" }}
  {{ $home := index hugo.Data $lang "home" }}
  {{ if not $home }}
    {{ $home = index hugo.Data "en" "home" }}
  {{ end }}

  {{ range $home.sections }}
    {{ partial "home/section.html" (dict "section" . "page" $) }}
  {{ end }}
{{ end }}
