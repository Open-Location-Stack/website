    id: "subscribe"
    eyebrow: "Mailing list"
    title: "Subscribe for release and project updates"
    intro: "Subscribe to receive updates about new releases and news for the Open Location Stack."
    list_uuid: "ab52eaf8-56ba-4428-8db4-c91bd711be63"
    fields:
      name:
        label: "Name"
        placeholder: "Your name"
      email:
