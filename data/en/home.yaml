        href: "https://www.sinfosy.com/"
        aria_label: "Sinfosy website"
        src: "https://assets.openlocationstack.com/images/openlocationstack/Sinfosy_digital_UG ohne Rahmen_1.webp"
        alt: "Sinfosy"
        class: "h-20 w-auto"
      - type: image
        href: "https://www.synchronicit.nl/"
        aria_label: "SynchronicIT website"
        src: "https://assets.openlocationstack.com/images/openlocationstack/SynchronicIT Logo only_blue_on_white_v1.4.svg"
        alt: "SynchronicIT"
        class: "h-20 w-auto"
      - type: image
