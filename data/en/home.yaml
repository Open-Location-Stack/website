sections:
  - type: hero
    logo:
      src: "https://assets.openlocationstack.com/images/openlocationstack/branding/open-rtls-logo.svg"
      alt: "Open Location Stack logo"
    tagline: "Open source building blocks for location software"
    title: "Open Location Stack"
    text: "Open Location Stack gives vendors, integrators, and product teams reusable software for hub federation, omlox-compatible integration, command-line operations, and indoor maps across mixed-vendor deployments."
    created_by:
      name: "FORMATION"
      link: "https://tryformation.com"
    actions:
      - label_i18n: "cta_primary"
        href: "mailto:open-rtls@tryformation.com"
        style: "primary"
      - label_i18n: "cta_secondary"
        href: "#hub"
        style: "secondary"
      - label_i18n: "cta_faq"
        href: "/faq/"
        style: "secondary"
    aside:
      title: "Platform overview"
      text: "The stack includes a cloud-capable hub of hubs for filtering, aggregating, and federating location data from on-premise omlox hubs and other location systems. The companion CLI supports operations against omlox 2.0-compatible hub APIs. IMDF-based vector maps add the spatial structure needed to interpret that data."
      highlights:
        - "Open Location Hub - filter, federate, and aggregate location data"
        - "Open Location Hub CLI - operate omlox-compatible hubs"
        - "Vector Graphics based venue maps"

  - type: prose
    id: "mission"
    section_class: "border-y border-line bg-neutral-50/50"
    title: "Mission"
    body: "Open Location Stack focuses on the software teams keep rebuilding between location hardware, hubs, maps, and applications. Real deployments still need the same venue models, connectors, hub adapters, and map tooling project after project. We are building those pieces as open source so vendors and integrators can spend more time on product and delivery work. The project was initiated by [FORMATION](https://tryformation.com), where we run production location projects and hit these gaps directly."

