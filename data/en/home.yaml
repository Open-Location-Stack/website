sections:
  - type: hero
    logo:
      src: "/images/open-rtls-logo.svg"
      alt: "Open Location Stack logo"
    tagline: "The OSS base platform for your location based applications"
    title: "Open Location Stack"
    text: "Open Location Stack helps asset tracking solution providers, integrators, and product teams work across hybrid, cross-vendor deployments without rebuilding the same hub, mapping, and integration layers for every project."
    created_by:
      name: "FORMATION"
      link: "https://tryformation.com"
    actions:
      - label_i18n: "cta_primary"
        href: "mailto:open-rtls@tryformation.com"
        style: "primary"
      - label_i18n: "cta_secondary"
        href: "#hub"
        style: "secondary"
      - label_i18n: "cta_faq"
        href: "/faq/"
        style: "secondary"
    aside:
      title: "Platform overview"
      text: "The platform provides a hub for aggregating and federating location information from on premise installations, other hubs, and outdoor asset or fleet tracking systems. Via connectors, any kind of system providing coordinates can be integrated. IMDF based vector maps provide the semantic layer to give meaning and context to the location data."
      highlights:
        - "Open Location Hub - federate and aggregate location data"
        - "Connectors for any RTLS or GNSS system"
        - "Vector Graphics based venue maps"

  - type: prose
    id: "mission"
    section_class: "border-y border-line bg-neutral-50/50"
    title: "Mission"
    body: "Open Location Stack is an open source initiative focused on the missing shared layer between location hardware, hubs, indoor maps, and downstream applications. Real deployments still rebuild the same venue models, connectors, hub adapters, and map capabilities vendor by vendor. We are building shared components so vendors and integrators can spend more effort on products and delivery instead of rebuilding plumbing. The project is initiated by [FORMATION](https://tryformation.com), where we run production location projects and run into these integration gaps directly."

  - type: card-grid
    id: "problem"
    section_class: "border-y border-line bg-neutral-50/50"
    grid_class: "mt-10 grid gap-4 md:grid-cols-3"
    title: "Stop reinventing wheels"
    intro: "Most asset-tracking vendors end up rebuilding the same hub, SDK, and mapping layers just to get coordinates on a screen. That wastes engineering time, creates brittle integrations, and leaves customers with closed, low-quality tooling where a shared open stack should exist."
    cards:
      - title: "Bitmap venue maps are not good enough anymore."
        description: "Modern outdoor maps are crisp, fast, and scalable because they use structured vector data and hardware-accelerated rendering. Indoor location products should not still depend on blurry bitmap exports of CAD drawings that fall apart as soon as users zoom in."
      - title: "Vendor-specific APIs and SDKs slow every integration down."
        description: "Location platforms only create value when they connect cleanly into operational software and customer workflows. Rewriting middleware and adapters for every RTLS vendor is exactly the kind of duplicated effort an open interoperability layer should remove."
      - title: "Proprietary middleware adds friction instead of leverage."
        description: "When the essential hub, SDK, and integration layers are gated behind closed products and licensing terms, integrators and solution providers inherit more cost, more complexity, and less freedom to build differentiated products."

  - type: opensource
    id: "opensource"
    title: "Open source fits this market"
    intro: "Location solutions depend on many hardware and software components across vendors, platforms, and partners. Rebuilding the same core stack in closed silos adds cost, complexity, and risk. Open source gives teams reusable infrastructure for integration, delivery, and product work."
    license_note: "Open Location Stack is released under the permissive [MIT License](https://opensource.org/license/mit), making it practical to embed, adapt, extend, and white-label while still building on a shared ecosystem."
    points:
      - title: "Commercial flexibility"
        description: "Use the stack in customer projects, packaged offerings, internal platforms, or partner-delivered solutions without licensing friction getting in the way."
      - title: "Faster productization"
        description: "Start from open hub, connector, and mapping building blocks instead of rebuilding the same infrastructure for every deployment."
      - title: "Shared codebase"
        description: "An open codebase is easier to evaluate, adapt, extend, and integrate across hybrid, cross-vendor deployments."

  - type: card-grid
    id: "hub"
    section_class: "border-y border-line bg-neutral-50/50"
    title: "Open Location Hub"
    intro: "Open Location Hub is the core integration product in the stack. It connects location feeds, exposes interoperable APIs, handles auth, and supports hybrid, cross-vendor deployments."
    actions:
      - label: "Product page"
        href: "/open-location-hub/"
      - label: "GitHub"
        href: "https://github.com/Open-Location-Stack/open-location-hub"
    cards:
      - title: "Reduce lock-in"
        description: "Work across vendor-specific systems and custom APIs without tying your application layer to one closed hub."
      - title: "Hybrid tracking"
        description: "Bring together cross-vendor location systems, from barcode, QR, and GPS to RTLS and sensors, with hierarchical tracking across sites, zones, and assets."
      - title: "Support product and integration teams"
        description: "Reuse the base layer for auth, event exchange, interoperability, and downstream map-aware applications."

  - type: feature
    id: "mapping"
    media_position: "right"
    title: "Indoor mapping that is usable in products"
    intro: "The mapping side of Open Location Stack focuses on structured indoor map data, not static floor-plan images. That creates a better base for rendering, routing, zoning, validation, and map-aware operational workflows."
    actions:
      - label: "Floor Plan Editor"
        href: "/floor-plan-editor/"
      - label: "GitHub"
        href: "https://github.com/Open-Location-Stack/floorplan-editor"
    items:
      - title: "Shared spatial context"
        description: "Places, levels, routes, and zones need a shared indoor model before live positions from multiple systems can be interpreted correctly."
      - title: "One operational view"
        description: "A strong map layer helps teams visualize hybrid tracking, site hierarchies, and operational activity in one coherent view."
      - title: "Reusable map capabilities"
        description: "Structured map data makes authoring, validation, rendering, and maintenance more reusable across projects."
    media:
      type: "image"
      src: "/images/mapping-stack.svg"
      alt: "Indoor mapping stack diagram"

  - type: feature-aside
    id: "connectors"
    title: "Plug in what you need."
    intro: "Open Location Hub supports a wide range of connectors so existing location deployments and technologies can participate without a rip-and-replace project."
    items:
      - title: "Existing hubs"
        description: "Plug in on-premise or cloud hubs such as Corriva Hub, Deephub, or other existing deployments where location data is already flowing."
      - title: "Location technologies"
        description: "Bring together barcode and QR-based flows, GNSS, camera-based systems, RFID, BLE, UWB, and other location technologies."
      - title: "Integrate ERP, MMS, SAP, and more"
        description: "Send and receive location data and operational events between the hub and ERP, MMS, SAP, and related enterprise systems using reusable connectors instead of bespoke integrations."
      - title: "Grow the connector ecosystem"
        description: "Location solution providers can contribute connectors, show compatibility, and add your logo to the Open Location Stack website."
    aside:
      eyebrow: "Partner CTA"
      title: "Do you provide solutions in this space?"
      text: "Connect your solution through a connector. Share your roadmap, discuss partner needs, and talk to us about adding your logo to the website."
      actions:
        - label_i18n: "cta_primary"
          href: "mailto:open-rtls@tryformation.com"
          style: "primary"
        - label: "Explore Open Location Hub"
          href: "/open-location-hub/"
          style: "secondary"

  - type: card-grid
    id: "technology-landscape"
    section_class: "border-y border-line bg-neutral-50/50"
    grid_class: "mt-10 grid gap-4 md:grid-cols-2 xl:grid-cols-3"
    title: "Location technology landscape"
    intro: "Location data comes from many technologies, from software systems and optical workflows to passive tags, outdoor positioning, and precise indoor positioning."
    cards:
      - title: "Existing software"
        description: "ERP, MMS, WMS, MES, SAP, and existing location platforms and hubs."
      - title: "Optic systems"
        description: "1D and 2D codes, OCR, and AI-based object recognition."
      - title: "Unpowered tags and chips"
        description: "RFID and NFC."
      - title: "Outdoor positioning"
        description: "GNSS, telematics, and fleet tracking."
      - title: "Indoor positioning"
        description: "UWB, BLE, Wi-Fi RTT, and related indoor positioning systems."
      - title: "Cradle to Grave tracking"
        description: "Most systems only track assets for part of their lifecycle and in limited areas. Cradle-to-grave tracking needs location data from production and logistics through customer use to recycling or decommissioning."

  - type: card-grid
    id: "ai-readiness"
    section_class: "border-y border-line bg-neutral-50/50"
    wrapper_class: "grid gap-8 lg:grid-cols-[1fr_1fr] lg:items-start"
    intro_block_class: ""
    cards_wrapper_class: "grid gap-4"
    title: "AI readiness for agentic logistics and manufacturing"
    intro: "Agentic logistics and manufacturing need an integrated view of the workplace. Open Location Hub brings together map context, live location flows, and system events in one place."
    cards:
      - title: "Accessible operational context"
        description: "AI systems need a usable picture of facilities, fleets, flows, and constraints rather than disconnected location feeds."
      - title: "Integrated workplace visibility"
        description: "Open Location Hub connects workplace systems, indoor maps, and hybrid tracking technologies so automation can work from one operational view."
      - title: "Foundation for agentic workflows"
        description: "A shared hub, semantic map structure, and connector ecosystem create a better base for orchestration, monitoring, and AI-assisted decision making."

  - type: audience
    id: "audience"
    title: "Built for every player in the location stack"
    intro: "Open Location Stack gives different stakeholders a common base to build on. Integrators can deliver faster, vendors are easier to adopt, enterprise teams reduce integration risk, and developers get practical tools instead of starting from scratch."
    image:
      src: "/images/zone-triggers.webp"
      alt: "Operational RTLS zone trigger workflow"
    cards:
      - title: "Solution Integrators"
        description: "Deliver cross-vendor location solutions faster by reusing shared hub, connector, and mapping building blocks instead of rebuilding the same integration layer for every project."
      - title: "Location technology vendors"
        description: "Make your products easier to integrate into real customer environments and improve adoption with interoperable APIs, connectors, and a better developer experience."
      - title: "Enterprise users"
        description: "De-risk deployment and integration programs with a modern, scalable base that fits more naturally into existing enterprise systems, data flows, and operating models."
      - title: "Developers"
        description: "Start with practical SDKs, middleware, and connector frameworks so teams can focus on application logic and delivery instead of foundational plumbing."

  - type: news
    id: "news"
    title: "Latest news"
    intro: "Follow product and engineering updates as the public repositories, docs, and early product releases evolve."
    actions:
      - label: "Browse all news"
        href: "/news/"
      - label: "RSS feed"
        href: "/news/index.xml"

  - type: standards
    id: "standards"
    title_i18n: "standards_title"
    intro_i18n: "standards_intro"
    items:
      - acronym: "OMLOX"
        name: "open locating standard"
        link: "https://omlox.com/"
        text: "OMLOX defines interoperable RTLS interfaces, including hub APIs and core-zone compatibility across vendors and applications."
      - acronym: "OGC IMDF"
        name: "Open Geospatial Consortium Indoor Mapping Data Format"
        link: "https://www.ogc.org/standards/indoor-mapping-data-format/"
        text: "IMDF is the structured indoor mapping model Open Location Stack treats as the foundation for portable venue maps and spatial context."
      - acronym: "MQTT"
        name: "Message Queuing Telemetry Transport"
        link: "https://mqtt.org/mqtt-specification/"
        text: "MQTT is lightweight glue for ingesting and distributing live telemetry, events, and updates around the map."

  - type: cta
    id: "cta"
    title_i18n: "contribute_title"
    text_i18n: "contribute_text"
    action:
      label_i18n: "cta_primary"
      href: "mailto:open-rtls@tryformation.com"

  - type: brand-strip
    section_class: "border-t border-line bg-neutral-50/50"
    label_i18n: "created_by"
    links:
      - type: image
        href: "https://tryformation.com"
        aria_label: "FORMATION website"
        src: "/images/formation-logo-text-black.svg"
        alt: "FORMATION"
        class: "h-12 w-auto"
      - type: text
        href: "https://github.com/Open-Location-Stack"
        label: "Open Location Stack on GitHub"
        class: "text-sm font-medium text-muted underline decoration-accent decoration-2 underline-offset-4"
