  - type: card-grid
    id: "problem"
    section_class: "border-y border-line bg-neutral-50/50"
    grid_class: "mt-10 grid gap-4 md:grid-cols-3"
    title: "Stop rebuilding the same stack"
    intro: "Many location products still rebuild the same hub logic, SDK glue, and map tooling just to get positions on a screen. That wastes engineering time and leaves customers with brittle integrations."
    cards:
      - title: "Bitmap venue maps do not scale"
        description: "Indoor products still rely on bitmap exports of CAD drawings far too often. Structured vector maps are easier to render, edit, validate, and reuse."
      - title: "Vendor-specific APIs slow integration work"
        description: "Location systems only become useful when they connect cleanly to business software and customer workflows. Rewriting adapters for every RTLS vendor is wasted effort."
      - title: "Closed middleware limits reuse"
        description: "When hub and integration layers stay proprietary, integrators and product teams inherit more cost, more coupling, and fewer options."

  - type: opensource
    id: "opensource"
    title: "Open source fits this market"
    intro: "Location solutions depend on many hardware and software components across vendors and sites. Rebuilding the same hub, connector, and mapping layers in private silos adds cost and complexity. Open source gives teams something reusable to start from."
    license_note: "Open Location Stack uses the permissive [MIT License](https://opensource.org/license/mit), so teams can embed, adapt, extend, and white-label the software."
    points:
      - title: "Commercial flexibility"
        description: "Use the stack in customer projects, packaged offerings, internal tools, or partner-delivered solutions without license friction."
      - title: "Faster productization"
        description: "Start from open hub, connector, and mapping components instead of rebuilding the same infrastructure for every deployment."
      - title: "Shared codebase"
        description: "An open codebase is easier to inspect, adapt, extend, and integrate across mixed-vendor deployments."

  - type: card-grid
    id: "hub"
    section_class: "border-y border-line bg-neutral-50/50"
    title: "Open Location Hub"
    intro: "Open Location Hub connects location feeds, exposes interoperable APIs, handles auth, and supports mixed-vendor deployments."
    actions:
      - label: "Product page"
        href: "/open-location-hub/"
      - label: "GitHub"
        href: "https://github.com/Open-Location-Stack/open-location-hub"
    cards:
      - title: "Reduce lock-in"
        description: "Work across vendor-specific systems and custom APIs without tying your application layer to one closed hub."
      - title: "Hybrid tracking"
        description: "Bring together RTLS, barcode, QR, GPS, and related location systems across sites, zones, and assets."
      - title: "Support product and integration teams"
        description: "Reuse the base layer for auth, event exchange, interoperability, and downstream applications."

  - type: feature
    id: "mapping"
    media_position: "right"
    title: "Indoor mapping that products can use"
    intro: "The mapping side of Open Location Stack focuses on structured indoor map data instead of static floor-plan images. That gives teams a better base for rendering, routing, zoning, and validation."
    actions:
      - label: "Floor Plan Editor"
        href: "/floor-plan-editor/"
      - label: "GitHub"
        href: "https://github.com/Open-Location-Stack/floorplan-editor"
    items:
      - title: "Shared spatial context"
        description: "Places, levels, routes, and zones need a shared indoor model before live positions from multiple systems can be interpreted correctly."
      - title: "Shared site context"
        description: "A strong map layer helps teams work with mixed tracking systems, site hierarchies, and operational activity in the same model."
      - title: "Reusable map capabilities"
        description: "Structured map data makes authoring, validation, rendering, and maintenance more reusable across projects."
    media:
      type: "image"
      src: "https://assets.openlocationstack.com/images/openlocationstack/diagrams/mapping-stack.svg"
      alt: "Indoor mapping stack diagram"

  - type: feature-aside
    id: "connectors"
    title: "Plug in what you need"
    intro: "Open Location Hub supports a wide range of connectors, so existing deployments can participate without a rip-and-replace project."
    items:
      - title: "Existing hubs"
        description: "Plug in on-premise or cloud hubs such as Corriva Hub, Deephub, or other existing deployments where location data is already flowing."
      - title: "Location technologies"
        description: "Bring together barcode and QR-based flows, GNSS, camera-based systems, RFID, BLE, UWB, and other location technologies."
      - title: "Integrate ERP, MMS, SAP, and more"
        description: "Send and receive location data and operational events between the hub and ERP, MMS, SAP, and related enterprise systems using reusable connectors."
      - title: "Grow the connector ecosystem"
        description: "Location solution providers can contribute connectors, show compatibility, and list support on the Open Location Stack website."
    aside:
      eyebrow: "Partner CTA"
      title: "Do you build in this space?"
      text: "Connect your solution through a connector. Share your roadmap, discuss partner needs, and talk to us about listing support on the website."
      actions:
        - label_i18n: "cta_primary"
          href: "mailto:open-rtls@tryformation.com"
          style: "primary"
        - label: "Explore Open Location Hub"
          href: "/open-location-hub/"
          style: "secondary"

  - type: card-grid
    id: "technology-landscape"
    section_class: "border-y border-line bg-neutral-50/50"
    grid_class: "mt-10 grid gap-4 md:grid-cols-2 xl:grid-cols-3"
    title: "Location technology landscape"
    intro: "Location data comes from many technologies, from software systems and optical workflows to passive tags, outdoor positioning, and precise indoor positioning."
    cards:
      - title: "Existing software"
        description: "ERP, MMS, WMS, MES, SAP, and existing location platforms and hubs."
      - title: "Optic systems"
        description: "1D and 2D codes, OCR, and AI-based object recognition."
      - title: "Unpowered tags and chips"
        description: "RFID and NFC."
      - title: "Outdoor positioning"
        description: "GNSS, telematics, and fleet tracking."
      - title: "Indoor positioning"
        description: "UWB, BLE, Wi-Fi RTT, and related indoor positioning systems."
      - title: "Cradle-to-grave tracking"
        description: "Most systems only track assets for part of their lifecycle and in limited areas. Cradle-to-grave tracking needs location data from production and logistics through customer use to recycling or decommissioning."

  - type: card-grid
    id: "ai-readiness"
    section_class: "border-y border-line bg-neutral-50/50"
    wrapper_class: "grid gap-8 lg:grid-cols-[1fr_1fr] lg:items-start"
    intro_block_class: ""
    cards_wrapper_class: "grid gap-4"
    title: "AI for logistics and manufacturing needs context"
    intro: "AI systems in logistics and manufacturing need map context, live location flows, and system events in the same place. Open Location Hub is built to connect those inputs."
    cards:
      - title: "Accessible operational context"
        description: "AI systems need a usable picture of facilities, fleets, flows, and constraints instead of disconnected location feeds."
      - title: "Integrated workplace visibility"
        description: "Open Location Hub connects workplace systems, indoor maps, and mixed tracking technologies so automation can work from one shared model."
      - title: "Foundation for agentic workflows"
        description: "A shared hub, semantic map structure, and reusable connectors create a better base for orchestration, monitoring, and AI-assisted decisions."

  - type: audience
    id: "audience"
    title: "Built for teams across the location stack"
    intro: "Open Location Stack gives integrators, vendors, enterprise teams, and developers reusable software to start from instead of forcing each group to rebuild the same core pieces."
    image:
      src: "https://assets.openlocationstack.com/images/openlocationstack/diagrams/zone-triggers.webp"
      alt: "Operational RTLS zone trigger workflow"
    cards:
      - title: "Solution Integrators"
        description: "Deliver mixed-vendor location solutions faster by reusing shared hub, connector, and mapping components instead of rebuilding the same integration layer for every project."
      - title: "Location technology vendors"
        description: "Make your products easier to integrate into real customer environments with interoperable APIs, connectors, and better tooling."
      - title: "Enterprise users"
        description: "Reduce deployment and integration risk with a base that fits more naturally into existing enterprise systems and data flows."
      - title: "Developers"
        description: "Start with practical middleware and connector frameworks so teams can focus on application logic and delivery."

  - type: news
    id: "news"
    title: "Latest news"
    intro: "Follow product and engineering updates as the repositories, docs, and releases evolve."
    actions:
      - label: "Browse all news"
        href: "/news/"
      - label: "RSS feed"
        href: "/news/index.xml"

  - type: standards
    id: "standards"
    title_i18n: "standards_title"
    intro_i18n: "standards_intro"
    items:
      - acronym: "OMLOX"
        name: "open locating standard"
        link: "https://omlox.com/"
        text: "OMLOX defines interoperable RTLS interfaces, including hub APIs and core-zone compatibility across vendors and applications."
      - acronym: "OGC IMDF"
        name: "Open Geospatial Consortium Indoor Mapping Data Format"
        link: "https://www.ogc.org/standards/indoor-mapping-data-format/"
        text: "IMDF is the structured indoor mapping model Open Location Stack uses for portable venue maps and spatial context."
      - acronym: "MQTT"
        name: "Message Queuing Telemetry Transport"
        link: "https://mqtt.org/mqtt-specification/"
        text: "MQTT is a lightweight transport for ingesting and distributing live telemetry, events, and updates around the map."

  - type: cta
    id: "cta"
    title_i18n: "contribute_title"
    text_i18n: "contribute_text"
    action:
      label_i18n: "cta_primary"
      href: "mailto:open-rtls@tryformation.com"
