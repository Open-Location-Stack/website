sections:
  - type: hero
    logo:
      src: "https://assets.openlocationstack.com/images/openlocationstack/branding/open-rtls-logo.svg"
      alt: "Open Location Stack logo"
    tagline: "Open source building blocks for location software"
    title: "Open Location Stack"
    text: "Open Location Stack gives vendors, integrators, and product teams reusable software for location hubs, connectors, and indoor maps across mixed-vendor deployments."
    created_by:
      name: "FORMATION"
      link: "https://tryformation.com"
    actions:
      - label_i18n: "cta_primary"
        href: "mailto:open-rtls@tryformation.com"
        style: "primary"
      - label_i18n: "cta_secondary"
        href: "#hub"
        style: "secondary"
      - label_i18n: "cta_faq"
        href: "/faq/"
        style: "secondary"
    aside:
      title: "Platform overview"
      text: "The stack includes a hub for aggregating and federating location data from on-premise systems, other hubs, and outdoor tracking systems. Connectors bring in RTLS, GNSS, barcode, QR, and related location feeds. IMDF-based vector maps add the spatial structure needed to interpret that data."
      highlights:
        - "Open Location Hub - federate and aggregate location data"
        - "Connectors for any RTLS or GNSS system"
        - "Vector Graphics based venue maps"

  - type: prose
    id: "mission"
    section_class: "border-y border-line bg-neutral-50/50"
    title: "Mission"
    body: "Open Location Stack focuses on the software teams keep rebuilding between location hardware, hubs, maps, and applications. Real deployments still need the same venue models, connectors, hub adapters, and map tooling project after project. We are building those pieces as open source so vendors and integrators can spend more time on product and delivery work. The project was initiated by [FORMATION](https://tryformation.com), where we run production location projects and hit these gaps directly."

  - type: brand-strip
    section_class: "border-t border-line bg-neutral-50/50"
    label_i18n: "supported_by"
    links:
      - type: image
        href: "https://tryformation.com"
        aria_label: "FORMATION website"
        src: "https://assets.openlocationstack.com/images/tryformation/formation-f-mark.svg"
        alt: "FORMATION"
        class: "h-20 w-auto"
